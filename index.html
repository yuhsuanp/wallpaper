<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>免費桌布下載</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    background: #111111;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    overflow: hidden;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh; /* 手機瀏覽器實際可視高度,避免被網址列擋住 */
  }

  .stage img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    -webkit-touch-callout: default; /* 允許長按選單 */
    user-select: none;
  }

  /* 疊在圖片上的提示區塊,不會被存進照片裡,純網頁顯示用 */
  .hint-overlay {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 28px 20px calc(28px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.45) 55%, rgba(0,0,0,0) 100%);
    text-align: center;
    pointer-events: none; /* 不擋住底下圖片的長按手勢 */
  }

  .hint-overlay .hint-icon {
    display: block;
    font-size: 26px;
    margin-bottom: 8px;
  }

  .hint-overlay strong {
    display: block;
    color: #ffffff;
    font-size: 16px;
    line-height: 1.6;
  }

  .hint-overlay span.sub {
    display: block;
    color: #e8e8e8;
    font-size: 13.5px;
    margin-top: 2px;
  }

  .hint-overlay .fallback {
    margin-top: 10px;
    font-size: 12px;
    color: #cfcfcf;
    pointer-events: auto; /* 讓下載連結可以被點擊 */
  }

  .hint-overlay .fallback a {
    color: #ffffff;
    text-decoration: underline;
  }
</style>
</head>
<body>

  <div class="stage">
    <!-- 請將 wallpaper.jpg 換成妳自己的桌布檔名,建議手機直式尺寸,例如 1170x2532 (iPhone) 或 1080x2340 (Android) -->
    <img src="wallpaper.jpg" alt="活動限定桌布" id="wallpaperImg">

    <div class="hint-overlay">
      <span class="hint-icon">👆</span>
      <strong>長按圖片,選擇「儲存圖片」</strong>
      <span class="sub">即可存到手機相簿</span>
      <div class="fallback">
        若長按無反應,<a href="wallpaper.jpg" download>點此下載</a>
      </div>
    </div>
  </div>

</body>
</html>
